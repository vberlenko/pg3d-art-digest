<!DOCTYPE html>
<!-- Dev preview: renders the digest from sample/counts.json in the browser, no Node needed.
     Serve the project root over HTTP (ES modules don't load from file://), then open /preview/. -->
<html lang="ru">
<head><meta charset="UTF-8"><title>digest preview</title></head>
<body>
<script type="module">
  import { buildSnapshot } from '../src/model.mjs';
  import { renderHtml, renderPages } from '../src/render.mjs';
  import { makeSampleJira } from '../src/jira.mjs';
  import { collect } from '../src/collect.mjs';

  const [config, sample] = await Promise.all([
    fetch('../config.json').then((r) => r.json()),
    fetch('../sample/counts.json').then((r) => r.json()),
  ]);
  const raw = await collect(config, makeSampleJira(sample));
  const snap = buildSnapshot(config, raw, new Date());
  window.__snapshot = snap;
  // ?page=1 / ?page=2 -> that page from config.pages; no param -> everything on one page
  const q = new URLSearchParams(location.search).get('page');
  const html = q ? renderPages(snap, config.pages)[Number(q) - 1].html : renderHtml(snap);
  document.open(); document.write(html); document.close();
</script>
</body>
</html>
