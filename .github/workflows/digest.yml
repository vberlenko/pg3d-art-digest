name: PG3D Art digest

on:
  schedule:
    # Every weekday 18:00 Yerevan (UTC+4, no DST) = 14:00 UTC
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render only, do not post to Slack'
        type: boolean
        default: false

concurrency:
  group: pg3d-art-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # no lockfile in the repo yet -> npm install instead of npm ci
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Build and post digest
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Optional override for a test channel: Settings -> Secrets and variables -> Actions -> Variables -> SLACK_CHANNEL_ID
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
        run: node src/digest.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Keep the rendered files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: out/
          retention-days: 30
